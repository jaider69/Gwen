<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Gwen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    
</head>
<body>
    <a href="/" class="back-link">← Volver</a>

    <div class="login-container">
        <h1>Inicio de Sesión</h1>
        <p>Ingresa a tu cuenta de Gwen</p>

    <form id="loginForm" action="/gwen" method="GET">
        <div class="input-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" placeholder="tu@email.com" required>
        </div>

        <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Contraseña" required>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Recordar usuario</label>
        </div>

        <button type="submit" class="btn">Iniciar Sesión</button>
    </form>

        <div class="links">
            <p>¿No tienes cuenta? <a href="/register">Regístrate aquí</a></p>
            <p>Demo: demo@gwen.com / demo123</p>
        </div>

    </div>
</body>

<script>
    const emailField = document.getElementById('email');
    const rememberCheckbox = document.getElementById('remember');
    const form = document.getElementById('loginForm');

    // Cargar email guardado al iniciar
    window.addEventListener('DOMContentLoaded', () => {
        const savedEmail = localStorage.getItem('rememberedEmail');
        if (savedEmail) {
            emailField.value = savedEmail;
            rememberCheckbox.checked = true;
        }
    });

    // Guardar o eliminar email al enviar
    form.addEventListener('submit', () => {
        if (rememberCheckbox.checked) {
            localStorage.setItem('rememberedEmail', emailField.value);
        } else {
            localStorage.removeItem('rememberedEmail');
        }
    });
</script>
</html>
