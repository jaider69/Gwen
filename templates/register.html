<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Gwen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body>
    <a href="/" class="back">← Volver</a>

    <div class="register-container">
        <h1>Registrarse</h1>
        <p class="subtitle">Crea tu cuenta en Gwen</p>

        <form id="registerForm" onsubmit="return false;">
            <div class="form-grid">
                <div class="input-group">
                    <label for="nombre">Nombre *</label>
                    <input type="text" id="nombre" placeholder="Tu nombre">
                </div>

                <div class="input-group">
                    <label for="apellido">Apellido *</label>
                    <input type="text" id="apellido" placeholder="Tu apellido">
                </div>

                <div class="input-group">
                    <label for="identificacion">Número de Identificación *</label>
                    <input type="text" id="identificacion" placeholder="Ej: 1234567890">
                </div>

                <div class="input-group">
                    <label for="telefono">Teléfono o Celular *</label>
                    <input type="tel" id="telefono" placeholder="Ej: 3001234567">
                </div>

                <div class="input-group full-width">
                    <label for="tienda">Nombre de la Tienda *</label>
                    <input type="text" id="tienda" placeholder="Nombre de tu tienda">
                </div>

                <div class="input-group full-width">
                    <label for="email">Correo Electrónico *</label>
                    <input type="email" id="email" placeholder="tu@email.com">
                </div>

                <div class="input-group">
                    <label for="password">Contraseña *</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Mínimo 6 caracteres">
                        <span class="toggle-password" onclick="togglePassword('password', this)">👁️</span>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirm_password">Confirmar Contraseña *</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirm_password" placeholder="Repite la contraseña">
                        <span class="toggle-password" onclick="togglePassword('confirm_password', this)">👁️</span>
                    </div>
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terminos">
                <label for="terminos">
                    Acepto los <a href="/terminos" target="_blank">Términos y Condiciones</a> y 
                    <a href="/politicas" target="_blank">Políticas de Privacidad</a>
                </label>
            </div>

            <button type="button" class="btn" onclick="goToLogin()">Crear Cuenta</button>
        </form>

        <div class="links">
            <p>¿Ya tienes cuenta? <a href="/login">Inicia sesión aquí</a></p>
        </div>

        <div class="footer">© 2025 Gwen. Todos los derechos reservados.</div>
    </div>

    <script>
        function togglePassword(fieldId, icon) {
            const input = document.getElementById(fieldId);
            if (input.type === "password") {
                input.type = "text";
                icon.textContent = "🙈";
            } else {
                input.type = "password";
                icon.textContent = "👁️";
            }
        }

        function goToLogin() {
            console.log('🔀 Redirigiendo a login...');
            window.location.href = '/login';
        }
    </script>
</body>
</html>
